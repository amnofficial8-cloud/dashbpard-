<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VXN Voice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --pink: #f4a7b9;
    --pink-dim: rgba(244, 167, 185, 0.35);
    --text: #f2f2f2;
    --text-dim: #8a8a8a;
    --danger: #ff6b6b;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    padding: 24px;
    position: relative;
  }

  .brand {
    position: absolute;
    top: 28px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 0.08em;
    color: var(--text-dim);
  }
  .brand span { color: var(--pink); }

  .title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(40px, 8vw, 72px);
    letter-spacing: 0.02em;
    margin: 0 0 8px;
    text-align: center;
  }

  .subtitle {
    color: var(--text-dim);
    font-size: 15px;
    margin-bottom: 56px;
    text-align: center;
    max-width: 420px;
    line-height: 1.5;
  }

  .orb-wrap {
    position: relative;
    width: 220px;
    height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid var(--pink-dim);
    width: 100%;
    height: 100%;
    opacity: 0;
  }

  .orb-wrap.listening .ring,
  .orb-wrap.speaking .ring {
    animation: pulse-ring 1.8s ease-out infinite;
  }

  @keyframes pulse-ring {
    0%   { transform: scale(0.7); opacity: 0.6; }
    100% { transform: scale(1.35); opacity: 0; }
  }

  .orb {
    width: 148px;
    height: 148px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #1c1c1c, #060606 70%);
    border: 1.5px solid #2a2a2a;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: border-color 0.3s ease, box-shadow 0.3s ease, transform 0.15s ease;
    position: relative;
    z-index: 1;
  }

  .orb:active { transform: scale(0.97); }

  .orb-wrap.connecting .orb {
    border-color: var(--text-dim);
    animation: spin-fade 1.2s ease-in-out infinite;
  }

  .orb-wrap.listening .orb {
    border-color: var(--pink);
    box-shadow: 0 0 32px var(--pink-dim);
  }

  .orb-wrap.speaking .orb {
    border-color: var(--pink);
    box-shadow: 0 0 48px var(--pink-dim);
    animation: breathe 1.1s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }

  @keyframes spin-fade {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  .mic-icon {
    width: 40px;
    height: 40px;
    stroke: var(--text);
    transition: stroke 0.3s ease;
  }
  .orb-wrap.listening .mic-icon,
  .orb-wrap.speaking .mic-icon { stroke: var(--pink); }

  .status {
    margin-top: 28px;
    font-size: 14px;
    color: var(--text-dim);
    letter-spacing: 0.02em;
    min-height: 20px;
    text-align: center;
  }

  .status.error { color: var(--danger); }

  .hint {
    position: absolute;
    bottom: 28px;
    font-size: 12px;
    color: #4a4a4a;
    text-align: center;
    max-width: 320px;
  }
</style>
</head>
<body>

  <div class="brand">VXN <span>VOICE</span></div>

  <h1 class="title">Talk to it.</h1>
  <p class="subtitle">Tap the mic, start talking. It listens, thinks, and answers back — no typing.</p>

  <div class="orb-wrap" id="orbWrap">
    <div class="ring"></div>
    <div class="orb" id="orb">
      <svg class="mic-icon" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
        <line x1="12" y1="19" x2="12" y2="23"></line>
        <line x1="8" y1="23" x2="16" y2="23"></line>
      </svg>
    </div>
  </div>

  <div class="status" id="status">Tap to start</div>

  <div class="hint">Needs mic access. Works best in Chrome or Edge. Preview API — expect occasional hiccups.</div>

  <script type="module">
    // ============================================================
    // VXN VOICE — conversational voice assistant
    // Built on Firebase AI Logic (Gemini Live API)
    //
    // SETUP — do this before it will work:
    // 1. In the Firebase console for your project, go to
    //    AI Services > AI Logic > Get started, choose the
    //    "Gemini Developer API" provider (free tier).
    // 2. That flow will also set up Firebase App Check, which
    //    Firebase now requires for AI Logic. For local/testing
    //    use, register the App Check "debug provider" token
    //    (see console: Security > App Check > Apps tab).
    //    For the live vxnoffice-hosted version, register a
    //    production reCAPTCHA v3 site key instead — see
    //    https://firebase.google.com/docs/ai-logic/app-check
    // 3. Paste your Firebase config below.
    // 4. Paste your reCAPTCHA v3 site key below (production)
    //    OR leave DEBUG_MODE = true while testing.
    // ============================================================

    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
    import {
      initializeAppCheck,
      ReCaptchaV3Provider
    } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app-check.js";
    import {
      getAI,
      getLiveGenerativeModel,
      GoogleAIBackend,
      ResponseModality,
      startAudioConversation
    } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-ai.js";

    // TODO(VXN): replace with your Firebase project config
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // Set to true while developing locally / before you have a
    // production reCAPTCHA key registered.
    const DEBUG_MODE = true;
    if (DEBUG_MODE) {
      self.FIREBASE_APPCHECK_DEBUG_TOKEN = true;
    }

    const RECAPTCHA_SITE_KEY = "YOUR_RECAPTCHA_V3_SITE_KEY";

    const firebaseApp = initializeApp(firebaseConfig);

    initializeAppCheck(firebaseApp, {
      provider: new ReCaptchaV3Provider(RECAPTCHA_SITE_KEY),
      isTokenAutoRefreshEnabled: true
    });

    const ai = getAI(firebaseApp, { backend: new GoogleAIBackend() });

    const liveModel = getLiveGenerativeModel(ai, {
      model: "gemini-3.1-flash-live-preview",
      generationConfig: {
        responseModalities: [ResponseModality.AUDIO]
      }
    });

    // ---- UI wiring ----
    const orbWrap = document.getElementById("orbWrap");
    const statusEl = document.getElementById("status");

    let session = null;
    let audioController = null;
    let isActive = false;

    function setState(state, message) {
      orbWrap.className = "orb-wrap" + (state ? " " + state : "");
      statusEl.textContent = message;
      statusEl.classList.toggle("error", state === "error");
    }

    async function startConversation() {
      try {
        setState("connecting", "Connecting…");
        session = await liveModel.connect();
        audioController = await startAudioConversation(session);
        isActive = true;
        setState("listening", "Listening — tap to stop");
      } catch (err) {
        console.error(err);
        isActive = false;
        setState("error", "Couldn't connect. Check your Firebase setup and mic permissions.");
      }
    }

    async function stopConversation() {
      try {
        if (audioController) await audioController.stop();
        if (session) await session.close();
      } catch (err) {
        console.error(err);
      }
      session = null;
      audioController = null;
      isActive = false;
      setState("", "Tap to start");
    }

    document.getElementById("orb").addEventListener("click", () => {
      if (isActive) {
        stopConversation();
      } else {
        startConversation();
      }
    });
  </script>
</body>
</html>
