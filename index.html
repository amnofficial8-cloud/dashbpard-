<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VXN Voice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --pink: #f4a7b9;
    --pink-dim: rgba(244, 167, 185, 0.35);
    --text: #f2f2f2;
    --text-dim: #8a8a8a;
    --danger: #ff6b6b;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    padding: 24px;
    position: relative;
  }

  .brand {
    position: absolute;
    top: 28px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 0.08em;
    color: var(--text-dim);
  }
  .brand span { color: var(--pink); }

  .title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(40px, 8vw, 72px);
    letter-spacing: 0.02em;
    margin: 0 0 8px;
    text-align: center;
  }

  .subtitle {
    color: var(--text-dim);
    font-size: 15px;
    margin-bottom: 56px;
    text-align: center;
    max-width: 420px;
    line-height: 1.5;
  }

  .face-wrap {
    position: relative;
    width: 240px;
    height: 240px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid var(--pink-dim);
    width: 100%;
    height: 100%;
    opacity: 0;
  }

  .face-wrap.active .ring {
    animation: pulse-ring 1.8s ease-out infinite;
  }

  @keyframes pulse-ring {
    0%   { transform: scale(0.72); opacity: 0.6; }
    100% { transform: scale(1.3); opacity: 0; }
  }

  .face {
    width: 168px;
    height: 168px;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, #1a1a1a, #050505 72%);
    border: 1.5px solid #262626;
    cursor: pointer;
    transition: border-color 0.4s ease, box-shadow 0.4s ease, transform 0.15s ease;
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
  }

  .face:active { transform: scale(0.98); }

  .face-wrap.connecting .face {
    border-color: var(--text-dim);
    animation: idle-pulse 1.3s ease-in-out infinite;
  }

  .face-wrap.active .face {
    border-color: var(--pink);
    box-shadow: 0 0 40px var(--pink-dim);
  }

  @keyframes idle-pulse {
    0%, 100% { opacity: 0.55; }
    50% { opacity: 1; }
  }

  /* Eyes */
  .eyes {
    display: flex;
    gap: 30px;
  }

  .eye {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--text-dim);
    transition: background 0.4s ease;
    animation: blink 5.5s ease-in-out infinite;
  }
  .eye:nth-child(2) { animation-delay: 0.15s; }

  .face-wrap.active .eye {
    background: var(--pink);
  }

  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(1); }
    96% { transform: scaleY(0.1); }
  }

  /* Mouth: 5-bar talking indicator, reads as a calm equalizer/mouth */
  .mouth {
    display: flex;
    align-items: center;
    gap: 5px;
    height: 22px;
  }

  .mouth-bar {
    width: 4px;
    height: 3px;
    border-radius: 2px;
    background: var(--text-dim);
    transition: background 0.4s ease, height 0.15s ease;
  }

  .face-wrap.active .mouth-bar {
    background: var(--pink);
    animation: talk 0.85s ease-in-out infinite;
  }

  .mouth-bar:nth-child(1) { animation-delay: 0s; }
  .mouth-bar:nth-child(2) { animation-delay: 0.12s; }
  .mouth-bar:nth-child(3) { animation-delay: 0.24s; }
  .mouth-bar:nth-child(4) { animation-delay: 0.12s; }
  .mouth-bar:nth-child(5) { animation-delay: 0s; }

  @keyframes talk {
    0%, 100% { height: 4px; }
    50% { height: 20px; }
  }

  .status {
    margin-top: 28px;
    font-size: 14px;
    color: var(--text-dim);
    letter-spacing: 0.02em;
    min-height: 20px;
    text-align: center;
  }

  .status.error { color: var(--danger); }

  .hint {
    position: absolute;
    bottom: 28px;
    font-size: 12px;
    color: #4a4a4a;
    text-align: center;
    max-width: 320px;
  }
</style>
</head>
<body>

  <div class="brand">VXN <span>VOICE</span></div>

  <h1 class="title">Talk to it.</h1>
  <p class="subtitle">Tap to start talking. It listens, thinks, and answers back — no typing.</p>

  <div class="face-wrap" id="faceWrap">
    <div class="ring"></div>
    <div class="face" id="face">
      <div class="eyes">
        <div class="eye"></div>
        <div class="eye"></div>
      </div>
      <div class="mouth">
        <div class="mouth-bar"></div>
        <div class="mouth-bar"></div>
        <div class="mouth-bar"></div>
        <div class="mouth-bar"></div>
        <div class="mouth-bar"></div>
      </div>
    </div>
  </div>

  <div class="status" id="status">Tap to start</div>

  <div class="hint">Needs mic access. Works best in Chrome or Edge. Preview API — expect occasional hiccups.</div>

  <script type="module">
    // ============================================================
    // VXN VOICE — conversational voice assistant
    // Built on Firebase AI Logic (Gemini Live API)
    //
    // SETUP — do this before it will work:
    // 1. In the Firebase console for your project, go to
    //    AI Services > AI Logic > Get started, choose the
    //    "Gemini Developer API" provider (free tier).
    // 2. That flow will also set up Firebase App Check, which
    //    Firebase now requires for AI Logic. For local/testing
    //    use, register the App Check "debug provider" token
    //    (see console: Security > App Check > Apps tab).
    //    For the live vxnoffice-hosted version, register a
    //    production reCAPTCHA v3 site key instead — see
    //    https://firebase.google.com/docs/ai-logic/app-check
    // 3. Paste your Firebase config below.
    // 4. Paste your reCAPTCHA v3 site key below (production)
    //    OR leave DEBUG_MODE = true while testing.
    // ============================================================

    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
    import {
      initializeAppCheck,
      ReCaptchaV3Provider
    } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app-check.js";
    import {
      getAI,
      getLiveGenerativeModel,
      GoogleAIBackend,
      ResponseModality,
      startAudioConversation
    } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-ai.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDGl93GcR018GnTRtEdLom6J6soOBbeDi4",
      authDomain: "vxn-system-login-sign-up.firebaseapp.com",
      projectId: "vxn-system-login-sign-up",
      storageBucket: "vxn-system-login-sign-up.firebasestorage.app",
      messagingSenderId: "617703170039",
      appId: "1:617703170039:web:6d74dfd1411bfb83e998f2"
    };

    // Set to true while developing locally / before you have a
    // production reCAPTCHA key registered.
    const DEBUG_MODE = true;
    if (DEBUG_MODE) {
      self.FIREBASE_APPCHECK_DEBUG_TOKEN = true;
    }

    const RECAPTCHA_SITE_KEY = "YOUR_RECAPTCHA_V3_SITE_KEY";

    const firebaseApp = initializeApp(firebaseConfig);

    try {
      initializeAppCheck(firebaseApp, {
        provider: new ReCaptchaV3Provider(RECAPTCHA_SITE_KEY),
        isTokenAutoRefreshEnabled: true
      });
    } catch (err) {
      console.warn("App Check init failed (continuing anyway):", err);
    }

    const ai = getAI(firebaseApp, { backend: new GoogleAIBackend() });

    const liveModel = getLiveGenerativeModel(ai, {
      model: "gemini-3.1-flash-live-preview",
      generationConfig: {
        responseModalities: [ResponseModality.AUDIO]
      }
    });

    // ---- UI wiring ----
    const faceWrap = document.getElementById("faceWrap");
    const statusEl = document.getElementById("status");

    let session = null;
    let audioController = null;
    let isActive = false;

    function setState(state, message) {
      faceWrap.className = "face-wrap" + (state ? " " + state : "");
      statusEl.textContent = message;
      statusEl.classList.toggle("error", state === "error");
    }

    async function startConversation() {
      try {
        setState("connecting", "Connecting…");
        session = await liveModel.connect();
        audioController = await startAudioConversation(session);
        isActive = true;
        setState("active", "Listening & talking — tap to stop");
      } catch (err) {
        console.error(err);
        isActive = false;
        const detail = (err && err.message) ? err.message : "Unknown error";
        setState("error", "Couldn't connect: " + detail);
      }
    }

    async function stopConversation() {
      try {
        if (audioController) await audioController.stop();
        if (session) await session.close();
      } catch (err) {
        console.error(err);
      }
      session = null;
      audioController = null;
      isActive = false;
      setState("", "Tap to start");
    }

    document.getElementById("face").addEventListener("click", () => {
      if (isActive) {
        stopConversation();
      } else {
        startConversation();
      }
    });
  </script>
</body>
</html>
